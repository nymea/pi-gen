name: nymea Raspberry Image

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "\"landing\" or \"experimental\" (leave empty for stable)"
        required: false

jobs:
  image:
    name: build image
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - name: setup build environment
      uses: docker/setup-qemu-action@v3.0.0
      with:
        platforms: arm64
    - name: build
      env:
        NYMEA_STAGE: ${{ github.event.inputs.stage }}
      run: |
        ls -la
        sudo apt-get install qemu-user-static
        case "$NYMEA_STAGE" in
          "") repository_uri="http://repository.nymea.io" ;;
          landing|experimental) repository_uri="http://repository.nymea.io/$NYMEA_STAGE" ;;
          *) echo "Invalid repository stage: $NYMEA_STAGE" >&2; exit 1 ;;
        esac
        echo "Setting repository to $repository_uri"
        sed -i "s|^URIs: .*|URIs: $repository_uri|" nymea/00-sys-tweaks/00-run-chroot.sh
        ./build-docker.sh
        ls -la
    - name: archive artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nymea image
        path: deploy/image*zip
